version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
        - name: date_date
          description: date of purchase
        - name: orders_id
          description: id of per order
        - name: products_id
          description: id of per product 
        - name: revenue
          description: revenue of per order
        - name: quantity
          description: quantity of per order

      - name: product
        identifier: raw_gz_product

      - name: ship
        identifier: raw_gz_ship